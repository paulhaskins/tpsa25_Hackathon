[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpsa-traffic"
version = "0.2.0"
description = "Traffic modelling, simulation, and data ingestion for infrastructure optimisation (TPSA25 Hackathon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TPSA25 Hackathon Team" }]
keywords = ["traffic", "transport", "graph", "simulation", "osmnx", "networkx", "scats", "tii"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "osmnx>=1.9.3",
  "networkx>=3.2",
  "matplotlib>=3.6.0",
  "pillow>=9.0.0",
  "typer>=0.12",
  "pandas>=2.2",
  "folium>=0.16",
  "numpy>=1.26",
  "requests>=2.32",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "pytest>=7.0",
]

[project.scripts]
traffic-model = "traffic_model.cli:main"
traffic-sim = "traffic_sim.cli:main"
datahub = "datahub.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_model*", "traffic_sim*", "datahub*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
